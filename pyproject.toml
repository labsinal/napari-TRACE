[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-TRACE"
version = "0.6.0"
description = "Tracking Review and Correction Engine - napari plugin for curating cell-tracking results"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Nickolas Pippi Peranzoni" }]
keywords = ["napari", "cell tracking", "curation", "microscopy", "lineage"]
dependencies = [
  # napari 0.5.x is numpy-1 compatible (tested with 0.5.6 + numpy 1.26); the <0.6
  # cap keeps out a future napari that would force numpy>=2 and clash with a
  # co-installed forNMA (which pins numpy<2 on Python <3.12 for cellpose).
  "napari[all]>=0.5,<0.6",
  "magicgui>=0.7,<0.11",
  "qtpy>=2.3",
  "imageio[ffmpeg]>=2.25",
  # Scientific deps: lower bounds only. numpy is intentionally NOT upper-capped
  # here so the plugin still works standalone on numpy 2 / Python 3.12+; when
  # co-installed, forNMA's own numpy pin drives the resolved version. Always
  # install the whole set in ONE pip pass (e.g. via requirements-local-ui.txt),
  # never plugin-after-app, or a lone `pip install napari-TRACE` can bump numpy.
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-image>=0.20",
  "scipy>=1.10",
  "tifffile>=2023.1.1",
  "matplotlib>=3.5",
]

# Lets forNMA (or anyone) launch the curator from the installed environment
# without knowing the source folder: `napari-trace` or `python -m curator.app`.
[project.scripts]
napari-trace = "curator.app:main"

[tool.setuptools.packages.find]
include = ["curator*"]
